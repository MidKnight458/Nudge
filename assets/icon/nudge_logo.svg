  <path
    d="M 62.5,29.0 A 2.3,2.3 0 0 1 64.8,31.3 L 64.8,36.2 A 2.3,2.3 0 0 1 62.5,38.5 A 2.3,2.3 0 0 1 60.2,36.2 L 60.2,31.3 A 2.3,2.3 0 0 1 62.5,29.0 Z"
    fill="#FFFFFF"/>

  <!-- Bold geometric rounded N -->
  <path
    d="M 45.0,67.8 L 45.0,53.2 L 63.0,67.8 L 63.0,53.2"
    fill="none"
    stroke="#1558C0"
