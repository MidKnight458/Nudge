  <!-- Twin symmetric calendar binder pills -->
  <path
    d="M 45.5,29.0 A 2.3,2.3 0 0 1 47.8,31.3 L 47.8,36.2 A 2.3,2.3 0 0 1 45.5,38.5 A 2.3,2.3 0 0 1 43.2,36.2 L 43.2,31.3 A 2.3,2.3 0 0 1 45.5,29.0 Z"
