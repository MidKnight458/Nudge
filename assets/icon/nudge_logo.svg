<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="18" y1="18" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2989FF"/>
      <stop offset="0.52" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#0E47A1"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="28" cy="22" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotGrad" x1="69" y1="31.5" x2="79" y2="41.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="108" height="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="108" height="108" fill="url(#bgGlow)"/>

  <!-- Soft drop shadow -->
  <path
    d="M 43,34 L 66.82,34 A 7.6,7.6 0 0 0 76,43.83 L 76,65 A 11,11 0 0 1 65,76 L 43,76 A 11,11 0 0 1 32,65 L 32,45 A 11,11 0 0 1 43,34 Z"
    transform="translate(0, 1.8)"
    fill="#072663"
    fill-opacity="0.15"/>

  <!-- Notched white calendar card -->
  <path
    d="M 43,34 L 66.82,34 A 7.6,7.6 0 0 0 76,43.83 L 76,65 A 11,11 0 0 1 65,76 L 43,76 A 11,11 0 0 1 32,65 L 32,45 A 11,11 0 0 1 43,34 Z"
    fill="#FFFFFF"/>

  <!-- Material 3 tonal header strip -->
  <path
    d="M 32,45 A 11,11 0 0 1 43,34 L 66.82,34 A 7.6,7.6 0 0 0 76,43.83 L 76,45 Z"
