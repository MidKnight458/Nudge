  <path
    d="M 61.0,29.5 A 2.4,2.4 0 0 1 63.4,31.9 L 63.4,37.1 A 2.4,2.4 0 0 1 61.0,39.5 A 2.4,2.4 0 0 1 58.6,37.1 L 58.6,31.9 A 2.4,2.4 0 0 1 61.0,29.5 Z"
    fill="#FFFFFF"/>

  <!-- Bold geometric rounded N -->
  <path
    d="M 42.5,70.5 L 42.5,55.0 L 61.5,70.5 L 61.5,55.0"
    fill="none"
    stroke="#1558C0"
