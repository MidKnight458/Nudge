  <!-- Twin symmetric calendar binder pills -->
  <path
    d="M 43.0,29.5 A 2.4,2.4 0 0 1 45.4,31.9 L 45.4,37.1 A 2.4,2.4 0 0 1 43.0,39.5 A 2.4,2.4 0 0 1 40.6,37.1 L 40.6,31.9 A 2.4,2.4 0 0 1 43.0,29.5 Z"
