  <rect x="0" y="0" width="108" height="108" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="108" height="108" fill="url(#bgGlow)"/>

  <!-- Soft drop shadow -->
  <path
    d="M 40.5,35 L 65.69,35 A 8.2,8.2 0 0 0 75,45.56 L 75,67.5 A 11.5,11.5 0 0 1 63.5,79 L 40.5,79 A 11.5,11.5 0 0 1 29,67.5 L 29,46.5 A 11.5,11.5 0 0 1 40.5,35 Z"
    transform="translate(0, 2.2)"
    fill="#072663"
    fill-opacity="0.16"/>

  <!-- Notched white calendar card -->
  <path
    d="M 40.5,35 L 65.69,35 A 8.2,8.2 0 0 0 75,45.56 L 75,67.5 A 11.5,11.5 0 0 1 63.5,79 L 40.5,79 A 11.5,11.5 0 0 1 29,67.5 L 29,46.5 A 11.5,11.5 0 0 1 40.5,35 Z"
    fill="#FFFFFF"/>

  <!-- Material 3 tonal header strip -->
  <path
    d="M 29,46.5 A 11.5,11.5 0 0 1 40.5,35 L 65.69,35 A 8.2,8.2 0 0 0 75,45.56 L 75,46.5 Z"
