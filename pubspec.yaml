name: nudge
description: "Gestión de citas estilo Pixel con sincronización de Google Calendar y recordatorios rápidos por WhatsApp."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Arquitectura, Estado y Reactividad
  flutter_riverpod: ^2.5.1
  connectivity_plus: ^6.0.3

  # UI Material 3 Expressive & Pixel Motion
  dynamic_color: ^1.7.0
  animations: ^2.0.11
  intl: ^0.19.0

  # Persistencia Local Offline-First (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Hardware, Contactos y Teléfonos
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1
  phone_numbers_parser: ^8.0.0

  # Ecosistema Google (Auth & Calendar v3)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Deep Linking WhatsApp
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
